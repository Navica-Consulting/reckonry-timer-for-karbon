# Runs Claude Code on Renovate PRs labelled major-upgrade. Claude applies the
# migration, runs the checks it can, pushes to the PR branch and comments a
# summary. It never merges. Add the claude-retry label to run it again.
# Renovate adds labels after opening the PR, so this triggers on the label.
name: Claude dependency upgrade

on:
  pull_request:
    types: [labeled, reopened]

concurrency:
  group: claude-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  upgrade:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'major-upgrade') &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'major-upgrade' ||
       github.event.label.name == 'claude-retry')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'renovate[bot]'
          claude_args: '--max-turns 60 --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(./build.sh:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"'
          prompt: |
            You are upgrading dependencies on Renovate PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read CLAUDE.md first and follow it. The PR body lists the packages, versions and release notes.
            The updates here are GitHub Actions (.github/workflows) and the endpoint-check script in
            scripts/endpoint-check (Playwright). Neither is part of the shipped extension.
            1. Read the changelog / migration guide for each major update.
            2. Apply the required changes: workflow inputs for Actions majors; code in scripts/endpoint-check for Playwright.
               Keep changes minimal. Do not touch src/, the manifest version or the store listing.
            3. Check what you can: for endpoint-check run `npm ci` and `node --check` on its scripts (it needs a Karbon login,
               so do not run the live check). For Actions, check new inputs against the action's action.yml.
               Run ./build.sh to confirm the build still works.
            4. Commit as "chore(deps): migrate for <package> <version>" and push to this PR branch.
            5. Comment on the PR: what changed, the migration notes used, and what a human should verify
               (for example, run `npm run check` in scripts/endpoint-check locally, or a manual Release "status" run).
            If you cannot finish safely, comment with the blocker and run `gh pr edit --add-label needs-human`.
            Never merge the PR.

      - name: Clear the claude-retry label
        if: always() && contains(github.event.pull_request.labels.*.name, 'claude-retry')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label claude-retry
