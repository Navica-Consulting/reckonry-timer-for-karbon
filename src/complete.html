<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finish time entry: Reckonry Timer for Karbon</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body.window { width:auto; max-width:440px; margin:0 auto; }
    #elapsedBig { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
    #why { color:var(--muted); }
  </style>
</head>
<body>
<main>
  <header>
    <h1 id="heading" tabindex="-1">Finish this time entry</h1>
    <span id="pill" class="pill paused">Paused</span>
  </header>

  <div class="card">
    <p id="elapsedBig" aria-hidden="true"></p>
    <p id="why"></p>
  </div>

  <form id="finish" novalidate>
    <!-- Client shows only where the firm books time to clients as well as work items. A work item picked wins. -->
    <div id="clientField" hidden></div>
    <div id="workField"></div>
    <ul class="items" id="suggest" style="margin-top:6px"></ul>
    <p id="workErr" class="err" hidden></p>

    <div class="pair">
      <div>
        <label for="role" class="field">Role</label>
        <select id="role" aria-describedby="roleErr"></select>
        <p id="roleErr" class="err" hidden></p>
      </div>
      <div>
        <label for="taskType" class="field">Task type</label>
        <select id="taskType" aria-describedby="taskTypeErr"></select>
        <p id="taskTypeErr" class="err" hidden></p>
      </div>
    </div>

    <label for="desc" class="field">Notes</label>
    <textarea id="desc" rows="2" aria-describedby="notesErr"></textarea>
    <p id="notesErr" class="err" hidden></p>

    <div class="actions">
      <button id="save" type="submit" class="btn primary">Save time entry</button>
      <button id="keep" type="button" class="btn">Keep paused</button>
      <!-- Same trash icon as the panel's timer card; the first press arms it red. -->
      <button id="discard" type="button" class="icon danger" aria-label="Discard timer" title="Discard timer" style="margin-left:auto; align-self:center">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>
      </button>
    </div>
  </form>

  <p id="msg" role="status" aria-live="polite"></p>
</main>
<script src="config.js"></script>
<script src="errors.js"></script>
<script src="ui.js"></script>
<script src="complete.js"></script>
</body>
</html>
